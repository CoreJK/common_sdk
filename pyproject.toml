[project]
name = "armpi_common"
version = "0.1.0"
description = "armpi 通信 sdk"
authors = [
    {name = "任伟明", email = "corejk@163.com"},
]
dependencies = ["pyserial>=3.5", "numpy>=1.21.0"]
requires-python = "<3.11,>=3.8"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[[tool.pdm.source]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.pdm]
distribution = true

[dependency-groups]
tests = [
    "pytest>=8.3.5",
    "ddt>=1.7.2",
]
